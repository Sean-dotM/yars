name: Compile YARA Rules

on:
  workflow_dispatch:
  push:
    paths:
    - 'yara/**'
    - '.github/workflows/compile-yara.yml'
  pull_request:
    paths:
    - 'yara/**'
    - '.github/workflows/compile-yara.yml'

env:
  YARA_X_VERSION: "1.23.0"

jobs:
  yara-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check-out the repository
        uses: actions/checkout@v4

      - name: Install YARA-X
        run: |
          set -euo pipefail
          asset="yara-x-v${YARA_X_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/VirusTotal/yara-x/releases/download/v${YARA_X_VERSION}/${asset}"

          curl -fL "${url}" -o "${RUNNER_TEMP}/${asset}"
          mkdir -p "${RUNNER_TEMP}/yara-x"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/yara-x"

          sudo install -m 0755 "${RUNNER_TEMP}/yara-x/yr" /usr/local/bin/yr

      - name: Show YARA-X version
        run: yr -V

      - name: Compile Yara Rules
        run: scripts/yara-compile.sh

